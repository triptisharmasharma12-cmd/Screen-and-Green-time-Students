function image(file,alt="Question image"){

const encodedFile = encodeURI(file);
const isDeviceUseImage = /device use\.png/i.test(file);
const errorHandler = isDeviceUseImage
  ? "if(!this.dataset.tryImages){this.dataset.tryImages='1';this.src='images/device%20use.png';}else if(!this.dataset.tryPlural){this.dataset.tryPlural='1';this.src='device%20uses.png';}else if(!this.dataset.tryUsage){this.dataset.tryUsage='1';this.src='device%20usage.png';}else{this.style.display='none';}"
  : "if(!this.dataset.tryImages){this.dataset.tryImages='1';this.src='images/" + encodedFile + "';}else{this.style.display='none';}";

return `

<div class="question-image-wrap">

<img

class="question-image"

src="${encodedFile}"

data-file="${encodedFile}"

alt="${alt}"

onerror="${errorHandler}">

</div>

`;

}

value="${x.value}"

<span>

</span>

</label>

`).join("");

}

alt="${x.alt || x.label}"

<label>

<input

type="radio"

name="${name}"

value="${x.value}"

required>

${x.label}

</label>


</div>

`).join("")}

</div>

`;

}



/* =========================================================
   GREEN TIME IMAGE
   ========================================================= */
function greenImage(file, alt="Green Time question image"){
  const encoded = encodeURI(file);
  const baseName = file.split("/").pop();
  const stem = baseName.replace(/\\.[^.]+$/, "");
  const candidates = [
    "images/" + baseName,
    baseName,
    "images/" + stem.toLowerCase() + ".png",
    stem.toLowerCase() + ".png",
    "images/" + stem + ".PNG",
    stem + ".PNG",
    "images/" + stem + ".jpg",
    stem + ".jpg",
    "images/" + stem + ".jpeg",
    stem + ".jpeg"
  ];
  return `
    <img class="green-time-image"
         src="${encodeURI(candidates[0])}"
         alt="${alt}"
         data-image-candidates='${JSON.stringify(candidates)}'
         onerror="(function(img){
           const list=JSON.parse(img.dataset.imageCandidates || '[]');
           const next=(Number(img.dataset.imageTry || 0))+1;
           img.dataset.imageTry=next;
           if(next < list.length){img.src=encodeURI(list[next]);}
           else{img.style.display='none';}
         })(this);">
  `;
}

/* =========================================================

function collect(){

document.querySelectorAll(

"#app input,#app select,#app textarea"

).forEach(el=>{


if(

(el.type==="checkbox" ||
el.type==="radio")

&&

!el.checked

)

return;


if(el.name){


if(el.type==="checkbox"){

data[el.name]=

data[el.name]

?

data[el.name]+", "+el.value

:

el.value;

}

else{

data[el.name]=el.value;

}

}

});

}


/* =========================================================
   SCREEN BREAKS SHOW / HIDE LOGIC
   ========================================================= */

function setupScreenBreakLogic(){

  const details =
    document.getElementById("screenBreakDetails");

  if(!details) return;

  const radios =
    document.querySelectorAll(
      'input[name="screen_breaks"]'
    );

  function updateScreenBreakDetails(){

    const answer =
      document.querySelector(
        'input[name="screen_breaks"]:checked'
      );

    const showDetails =
      answer && answer.value === "Yes";

    details.style.display =
      showDetails ? "block" : "none";

    if(!showDetails){

      document
        .querySelectorAll(
          'input[name="screen_sessions"]'
        )
        .forEach(el => {
          el.checked = false;
        });

      document
        .querySelectorAll(
          'input[name="screen_morning"],' +
          'input[name="screen_afternoon"],' +
          'input[name="screen_evening"],' +
          'input[name="screen_night"]'
        )
        .forEach(el => {
          el.value = "";
        });
    }
  }

  radios.forEach(radio => {

    radio.addEventListener(
      "change",
      updateScreenBreakDetails
    );

  });

  updateScreenBreakDetails();
}

/* =========================================================
   VALIDATION
   ========================================================= */

function valid(){


const err=
document.getElementById("err");


/* Required text / number inputs */

const requiredInputs=
document.querySelectorAll(
"#app input[required]"
);


for(const el of requiredInputs){


if(
el.type==="radio" ||
el.type==="checkbox"
)

continue;


if(!el.value.trim()){

err.style.display="block";

el.focus();

return false;

}

}


/* Radio groups */

const radios=
[

...document.querySelectorAll(
"#app input[type=radio]"
)

];


const radioNames=
[

...new Set(
radios.map(x=>x.name)
)

];


for(const name of radioNames){

    // If the participant selected "No" for screen breaks,
    // do not require an answer for screen_sessions.
    if(name === "screen_sessions"){

        const screenBreakAnswer =
        document.querySelector(
            'input[name="screen_breaks"]:checked'
        );

        if(
            screenBreakAnswer &&
            screenBreakAnswer.value === "No"
        ){
            continue;
        }
    }

    const checked =
    document.querySelector(
        `#app input[type=radio][name="${CSS.escape(name)}"]:checked`
    );

    if(!checked){

        err.style.display="block";

        return false;

    }

}


return true;

}
